name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    id-token: write

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    go:
        name: Go
        uses: dz-market/github-actions/.github/workflows/go-ci.yml@v1
        with:
            modules: |
                config
                database/postgres
                grpc
                logger
                vault