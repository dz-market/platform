name: Release module tags

on:
    push:
        tags: ["release-*"]
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: module-release
    cancel-in-progress: false

jobs:
    tags:
        name: Tag modules
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            -   uses: actions/checkout@v7
                with:
                    ref: ${{ github.sha }}
                    fetch-depth: 0
                    persist-credentials: true

            -   uses: actions/setup-go@v7
                with:
                    go-version-file: internal/repotools/go.mod
                    cache-dependency-path: internal/repotools/go.sum

            -   name: Create module tags
                working-directory: internal/repotools
                env:
                    RELEASE_REF: ${{ github.sha }}
                run: go run ./cmd/tagrelease -root ../..